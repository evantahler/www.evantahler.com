<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Trophy on a laptop">
  <rect width="400" height="300" fill="#1e1b4b"/>
  <g fill="#312e81" opacity="0.6">
    <circle cx="60" cy="50" r="3"/><circle cx="340" cy="70" r="3"/><circle cx="90" cy="230" r="2"/><circle cx="320" cy="220" r="2"/><circle cx="200" cy="30" r="2"/>
  </g>
  <!-- laptop -->
  <rect x="110" y="170" width="180" height="90" rx="8" fill="#334155"/>
  <rect x="120" y="180" width="160" height="72" rx="3" fill="#0f172a"/>
  <path d="M90 262 h220 l-12 14 h-196 z" fill="#475569"/>
