    <rect x="-7" y="66" width="14" height="22" fill="#f59e0b"/>
    <rect x="-30" y="88" width="60" height="14" rx="3" fill="#d97706"/>
    <path d="M-25 6 v26 a25 25 0 0 0 14 22" fill="none" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/>
